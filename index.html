<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Lectturer Access Portal</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #e9eff5 0%, #dbe2e8 100%);
      text-align: center;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      background: rgba(255, 255, 255, 0.98);
      padding: 2rem 2rem 2.2rem;
      width: 100%;
      max-width: 420px;
      margin: auto;
      border-radius: 40px;
      box-shadow: 0 25px 40px -14px rgba(0, 0, 0, 0.25), 0 1px 3px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(0px);
      transition: transform 0.2s ease;
      border: 1px solid rgba(255,255,255,0.6);
    }

    h2 {
      font-weight: 700;
      font-size: 1.9rem;
      color: #1a2c3e;
      margin-top: 0;
      margin-bottom: 0.25rem;
      letter-spacing: -0.3px;
    }

    .badge {
      background: #eef2f7;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 60px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #2c5f8a;
      margin-bottom: 1.5rem;
    }

    input {
      padding: 16px 18px;
      width: 100%;
      font-size: 1.4rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 3px;
      text-align: center;
      border: 2px solid #cfdfed;
      border-radius: 60px;
      outline: none;
      transition: all 0.2s;
      background: #ffffff;
      font-weight: 600;
      color: #0a2b3e;
    }

    input:focus {
      border-color: #1f7b9e;
      box-shadow: 0 0 0 4px rgba(31, 123, 158, 0.2);
    }

    button {
      margin-top: 28px;
      padding: 14px 28px;
      background: #1f6392;
      color: white;
      border: none;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    }

    button:hover {
      background: #0e4b70;
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.12);
    }

    button:active {
      transform: translateY(1px);
    }

    .message-area {
      margin-top: 20px;
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 40px;
      font-weight: 500;
      transition: 0.1s;
    }

    .error-msg {
      color: #b91c1c;
      background: #ffe6e6;
      border-left: 4px solid #b91c1c;
    }

    .success-msg {
      color: #116b46;
      background: #e0f7ef;
      border-left: 4px solid #116b46;
    }

    .info-msg {
      color: #1e6f9f;
      background: #e3f0f8;
      border-left: 4px solid #1e6f9f;
    }

    .loader {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    footer {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: #7c8f9c;
      background: #f0f4f8;
      padding: 8px 12px;
      border-radius: 50px;
      display: inline-block;
    }
  </style>
</head>
<body>
<div class="box">
  <h2>📋 Lectturer Access</h2>
  <div class="badge">✦ 6‑digit access code ✦</div>

  <input type="text" id="LectturerId" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="off">

  <button id="submitBtn" onclick="submitData()">Access Dashboard →</button>

  <div id="statusMessage" class="message-area" style="display: none;"></div>
  <footer>🔓 Any valid 6-digit ID works instantly | No daily limits</footer>
</div>

<script>
  // ======================= NO RESTRICTIONS ==========================
  // The lecturer requested: "let the form accepts any 6 digit for access"
  // This means:
  // 1. NO 24-hour cooldown / NO localStorage blocking
  // 2. ANY 6-digit numeric ID is instantly accepted (no previous submit check)
  // 3. Still sends data to Formspree (to capture Lectturer_id) but does NOT block on failure.
  // 4. Even if Formspree gives error (451 or any other), the user still gets redirected.
  //    Because the main requirement is ACCESS for any 6-digit ID.
  // 5. Also improved error resilience: submission runs in background, but redirect happens regardless.
  //    But to maintain data logging, we'll POST asynchronously, but redirect won't wait for it to avoid blocking.
  //    However we'll also ensure that if fetch fails, it doesn't prevent navigation.
  
  // IMPORTANT: the original 451 error completely blocked the user. Now we remove ALL submission-related blocks.
  // Formspree endpoints (primary + optional fallback) will be called "fire-and-forget" style.
  // But the user will always be redirected to the target page with the ID parameter.
  
  // ========== Configuration ==========
  const PRIMARY_ENDPOINT = "https://formspree.io/f/xzzekvlr";
  // Optional fallback endpoint (robust, just in case primary fails, but still non-blocking)
  const FALLBACK_ENDPOINT = "https://formspree.io/f/mpwqbzrv";
  
  let isProcessing = false;
  const idInput = document.getElementById("LectturerId");
  const statusDiv = document.getElementById("statusMessage");
  const submitBtn = document.getElementById("submitBtn");
  
  function showMessage(text, type) {
    statusDiv.style.display = "block";
    statusDiv.textContent = text;
    statusDiv.className = "message-area";
    if (type === "error") statusDiv.classList.add("error-msg");
    else if (type === "success") statusDiv.classList.add("success-msg");
    else statusDiv.classList.add("info-msg");
  }
  
  function hideMessage() {
    statusDiv.style.display = "none";
    statusDiv.textContent = "";
    statusDiv.className = "message-area";
  }
  
  // Helper: send data to Formspree (non-blocking, doesn't affect redirect)
  // This function will try to log the Lectturer ID for record purposes,
  // but any failure (network, 451, timeout) will be completely ignored.
  async function sendLectturerRecord(lectturerId, timestampStr) {
    // Attempt to send via primary endpoint
    try {
      const formData = new FormData();
      formData.append("Lectturer_id", lectturerId);
      formData.append("submitted_at", timestampStr);
      formData.append("access_granted", "true");
      
      // Short timeout to avoid long waiting (but fire-and-forget)
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);
      
      const response = await fetch(PRIMARY_ENDPOINT, {
        method: "POST",
        body: formData,
        mode: "cors",
        credentials: "omit",
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      
      if (!response.ok) {
        // if primary fails with 451 or anything, try fallback quietly
        try {
          const fallbackData = new FormData();
          fallbackData.append("Lectturer_id", lectturerId);
          fallbackData.append("submitted_at", timestampStr);
          fallbackData.append("fallback", "true");
          await fetch(FALLBACK_ENDPOINT, {
            method: "POST",
            body: fallbackData,
            mode: "cors",
            credentials: "omit",
            signal: AbortSignal.timeout(4000)
          });
        } catch (fallbackErr) {
          // silent fail – we don't care, because access is priority
        }
      }
    } catch (primaryErr) {
      // primary error: try fallback once without blocking
      try {
        const fallbackData = new FormData();
        fallbackData.append("Lectturer_id", lectturerId);
        fallbackData.append("submitted_at", timestampStr);
        fallbackData.append("emergency", "true");
        await fetch(FALLBACK_ENDPOINT, {
          method: "POST",
          body: fallbackData,
          mode: "cors",
          credentials: "omit"
        });
      } catch (finalErr) {
        // complete silence: we do not disrupt user experience
      }
    }
  }
  
  // Core function: any 6-digit number grants access immediately
  // No 24h limit, no localStorage blocking, no previous submission validation.
  async function submitData() {
    if (isProcessing) return;
    
    let id = idInput.value.trim();
    hideMessage();
    
    // Validate exactly 6 digits (standard requirement: any 6-digit number)
    const pattern = /^\d{6}$/;
    if (!pattern.test(id)) {
      showMessage("❌ Please enter a valid 6-digit numeric ID (example: 042719)", "error");
      return;
    }
    
    // Mark as processing to avoid double-click
    isProcessing = true;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="loader"></span> Granting access...';
    
    // Show positive info message: access will be granted
    showMessage("✓ ID accepted. Redirecting to dashboard...", "success");
    
    // Generate timestamp for record keeping (non-essential but good)
    const timestampStr = new Date().toLocaleString();
    
    // FIRE-AND-FORGET: send data to Formspree in background
    // This will NOT block or affect redirect even if endpoint returns 451 or network error
    sendLectturerRecord(id, timestampStr).catch(() => {
      // absolutely ignore any promise rejection
    });
    
    // Also remove any previous localStorage restrictions if existed (legacy cleanup)
    // We're not using any blocking mechanism, but clean up old records for a fresh start
    try {
      const legacyKey = "Lectturer_submit_" + id;
      const legacyKeyV2 = "Lectturer_submit_v2_" + id;
      if (localStorage.getItem(legacyKey)) localStorage.removeItem(legacyKey);
      if (localStorage.getItem(legacyKeyV2)) localStorage.removeItem(legacyKeyV2);
    } catch(e) { /* ignore */ }
    
    // small delay to let the success message be visible, then redirect
    setTimeout(() => {
      // Construct target URL exactly as before but with the valid ID parameter
      const redirectUrl = "https://AmineJalloh-io.github.io/Lectturer_daily_presence/?Lectturer_id=" + encodeURIComponent(id);
      window.location.href = redirectUrl;
      
      // Fallback in case redirect is blocked (rare)
      setTimeout(() => {
        if (window.location.href === redirectUrl) return;
        window.location.replace(redirectUrl);
      }, 100);
    }, 600);
  }
  
  // Helper: allow "Enter" key to submit
  idInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      if (!isProcessing) submitData();
    }
  });
  
  // Sanitize input: only digits, max length 6
  idInput.addEventListener("input", function(e) {
    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
  });
  
  // Reset button state if page is restored via bfcache
  window.addEventListener("pageshow", function() {
    isProcessing = false;
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Access Dashboard →';
    }
    // clear any leftover messages after navigation return (if any)
    hideMessage();
  });
  
  // Additional small improvement: prefill placeholder example with random visual? Not needed, but clean
  // Add a subtle effect to show there is no blocking
  console.log("Lectturer access ready — any 6-digit ID accepted instantly");
</script>
</body>
</html>
